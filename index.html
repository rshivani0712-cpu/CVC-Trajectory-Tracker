    <!-- Compatibility safeguard for sandboxed iframe environments where window.fetch has only a getter -->
    <script>
      (function() {
        try {
          // Listen for and suppress unhandled getter-only assignment errors in sandbox
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
              e.preventDefault();
              console.warn('[CVC Digital Twin] Suppressed iframe environment fetch setter error:', e.message);
            }
          });

          var targetFetch = window.fetch;
          if (typeof targetFetch === 'function') {
            var currentFetch = targetFetch.bind(window);
            var winProto = window.Window ? window.Window.prototype : Object.getPrototypeOf(window);

            // Attempt to define setter on Window.prototype if configurable
            if (winProto) {
              try {
                var protoDesc = Object.getOwnPropertyDescriptor(winProto, 'fetch');
                if (protoDesc && protoDesc.configurable && !protoDesc.set) {
                  Object.defineProperty(winProto, 'fetch', {
                    get: function() { return currentFetch; },
                    set: function(val) { currentFetch = val; },
                    configurable: true,
                    enumerable: protoDesc.enumerable !== undefined ? protoDesc.enumerable : true
                  });
                }
              } catch (errProto) {}
            }

            // Define own property with getter and setter directly on window
            try {
              var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
              if (!winDesc || winDesc.configurable || (!winDesc.set && winDesc.configurable !== false)) {
                Object.defineProperty(window, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (errWin) {}
          }
        } catch (err) {
          console.warn('[CVC Digital Twin] Fetch compatibility setup warning:', err);
        }
      })();
    </script>
